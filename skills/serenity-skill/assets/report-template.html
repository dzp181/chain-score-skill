<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>产业链卡点研究 · Serenity</title>
<style>
/* ============ tokens ============ */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --r-xl: 24px; --r-l: 22px; --r-m: 16px; --r-s: 12px;

  --glass: rgba(255,255,255,.58);
  --glass-strong: rgba(255,255,255,.84);
  --glass-soft: rgba(255,255,255,.44);
  --hair: rgba(255,255,255,.62);
  --inner: inset 0 1px 0 rgba(255,255,255,.92);
  --shadow: 0 24px 60px -26px rgba(30,28,60,.30), 0 2px 8px rgba(30,28,60,.05);
  --shadow-sm: 0 10px 26px -16px rgba(30,28,60,.28);

  --ink-1: #17171d;
  --ink-2: #3c3c46;
  --ink-3: #6c6c7a;
  --ink-4: #9a9aa8;

  --accent: #6357f5;
  --accent-2: #a855f7;
  --accent-soft: rgba(99,87,245,.10);
  --s: #6357f5;
  --a: #2f7ff0;
  --b: #b48100;
  --c: #7b7b88;
  --rise: #c9442a;
  --fall: #148a63;

  --spring: cubic-bezier(.22,1.2,.36,1);
  --ease: cubic-bezier(.4,0,.2,1);
}

@media (prefers-color-scheme: dark){
  :root{
    --glass: rgba(32,32,42,.58);
    --glass-strong: rgba(40,40,52,.82);
    --glass-soft: rgba(28,28,38,.42);
    --hair: rgba(255,255,255,.10);
    --inner: inset 0 1px 0 rgba(255,255,255,.10);
    --shadow: 0 26px 64px -28px rgba(0,0,0,.72), 0 2px 8px rgba(0,0,0,.30);
    --shadow-sm: 0 10px 26px -16px rgba(0,0,0,.6);
    --ink-1: #f2f2f6;
    --ink-2: #cfcfda;
    --ink-3: #9b9bab;
    --ink-4: #74748a;
    --accent: #8b82ff;
    --accent-2: #c084fc;
    --accent-soft: rgba(139,130,255,.16);
    --s: #8b82ff; --a: #5aa2ff; --b: #e0a92e; --c: #9b9bab;
    --rise: #ff7a55; --fall: #34c79a;
  }
}

*{ box-sizing: border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family: var(--font);
  font-size: 13.5px;
  line-height: 1.65;
  color: var(--ink-1);
  background: #eef1f7;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ============ ambient ============ */
.ambient{ position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  background:
    radial-gradient(1100px 640px at 8% -12%, #d5deff 0%, transparent 60%),
    radial-gradient(920px 620px at 96% 0%, #f2d8ff 0%, transparent 62%),
    radial-gradient(900px 720px at 42% 114%, #cfe9ff 0%, transparent 60%),
    radial-gradient(760px 520px at 78% 62%, #e6e2ff 0%, transparent 66%),
    linear-gradient(165deg, #f7f8fc 0%, #eaeef7 55%, #e5eaf5 100%);
}
@media (prefers-color-scheme: dark){
  .ambient{ background:
    radial-gradient(1100px 640px at 8% -14%, #232a52 0%, transparent 62%),
    radial-gradient(920px 620px at 96% 0%, #35204e 0%, transparent 64%),
    radial-gradient(900px 720px at 44% 114%, #10283a 0%, transparent 62%),
    linear-gradient(165deg, #12121a 0%, #0e0e16 60%, #0b0b12 100%); }
}
.orb{ position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; }
.o1{ width: 420px; height: 420px; left: -90px; top: 12%; background: radial-gradient(circle,#c7d2ff,transparent 68%); animation: drift1 26s var(--ease) infinite alternate; }
.o2{ width: 380px; height: 380px; right: -60px; top: 4%; background: radial-gradient(circle,#f0d3ff,transparent 68%); animation: drift2 32s var(--ease) infinite alternate; }
.o3{ width: 460px; height: 460px; left: 42%; bottom: -180px; background: radial-gradient(circle,#cdeaff,transparent 68%); animation: drift3 38s var(--ease) infinite alternate; }
@media (prefers-color-scheme: dark){
  .orb{ opacity:.26; }
  .o1{ background: radial-gradient(circle,#3b4a9e,transparent 68%); }
  .o2{ background: radial-gradient(circle,#6d3f96,transparent 68%); }
  .o3{ background: radial-gradient(circle,#1c5a7a,transparent 68%); }
}
@keyframes drift1{ to{ transform: translate3d(60px,40px,0) scale(1.08); } }
@keyframes drift2{ to{ transform: translate3d(-50px,60px,0) scale(1.12); } }
@keyframes drift3{ to{ transform: translate3d(40px,-50px,0) scale(1.06); } }

/* ============ shell ============ */
.app{
  position: relative; z-index: 1;
  max-width: 1440px; margin: 0 auto;
  padding: 20px 22px 34px;
  display: flex; flex-direction: column; gap: 16px;
}

.glass{
  position: relative;
  background: var(--glass);
  backdrop-filter: blur(26px) saturate(200%);
  -webkit-backdrop-filter: blur(26px) saturate(200%);
  border: 1px solid var(--hair);
  border-radius: var(--r-l);
  box-shadow: var(--inner), var(--shadow);
}
.glass::after{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0) 34%);
  opacity:.7;
}
@media (prefers-color-scheme: dark){
  .glass::after{ background: linear-gradient(180deg, rgba(255,255,255,.06), transparent 34%); }
}

/* ============ head actions ============ */
.tq-right{ margin-left:auto; flex:0 0 auto; display:flex; align-items:center; gap:8px; }
.badge-demo{
  font-size:11px; font-weight:600; letter-spacing:.06em;
  color:#8a5a00; background: rgba(255,196,84,.26);
  border:1px solid rgba(255,196,84,.55);
  padding: 3px 9px; border-radius:999px;
}
@media (prefers-color-scheme: dark){ .badge-demo{ color:#ffd591; background: rgba(255,196,84,.14); } }
.topdate{ font-size:11.5px; color: var(--ink-4); letter-spacing:.04em; font-variant-numeric: tabular-nums; }
.btn-ghost{
  border:1px solid var(--hair); background: var(--glass-soft); color: var(--ink-2);
  font: inherit; font-size:12px; padding: 6px 13px; border-radius:999px; cursor:pointer;
  transition: transform .28s var(--spring), background .2s var(--ease), color .2s;
}
.btn-ghost:hover{ background: var(--glass-strong); color: var(--ink-1); transform: translateY(-1px); }
.btn-ghost:active{ transform: scale(.97); }

/* ============ cards ============ */
.card{ padding: 16px 18px; }
.card-hd{
  display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  margin-bottom: 10px;
}
.card-hd h2{ margin:0; font-size:12.5px; font-weight:600; letter-spacing:.06em; color: var(--ink-2); }
.card-hd h2 i{ font-style:normal; color: var(--ink-4); font-weight:500; font-size:11px; margin-left:6px; letter-spacing:.02em; }
.hd-note{ font-size:11px; color: var(--ink-4); font-variant-numeric: tabular-nums; letter-spacing:.03em; }

/* ============ theme head ============ */
.themed{ display:flex; flex-direction:column; gap:12px; }
.themed .tq{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.themed h1{ margin:0; font-size:22px; line-height:1.3; font-weight:650; letter-spacing:-.02em; color: var(--ink-1); }
.tagline{
  font-size:11px; padding:2px 9px; border-radius:999px; letter-spacing:.04em;
  background: var(--accent-soft); color: var(--accent);
  border:1px solid color-mix(in srgb, var(--accent) 22%, transparent);
}
.verdict{
  margin:0; font-size:14.5px; line-height:1.7; color: var(--ink-2);
  padding-left: 12px; border-left: 2.5px solid color-mix(in srgb, var(--accent) 55%, transparent);
}
.stats{ display:grid; grid-template-columns: repeat(3, 108px); gap:10px; }
.split{ display:grid; grid-template-columns: minmax(0,1fr) auto; gap: 24px; align-items:center; }
@media (max-width: 980px){ .split{ grid-template-columns: 1fr; gap:12px; } }
@media (max-width: 760px){ .stats{ grid-template-columns: 1fr 1fr 1fr; } }
.stat{ background: var(--glass-soft); border:1px solid var(--hair); border-radius: var(--r-s); padding: 8px 12px; }
.stat .sl{ font-size:10.5px; color: var(--ink-4); letter-spacing:.07em; }
.stat .sv{ font-size:17px; font-weight:650; letter-spacing:-.02em; font-variant-numeric: tabular-nums; color: var(--ink-1); }
.stat .sv small{ font-size:11px; font-weight:500; color: var(--ink-4); margin-left:3px; letter-spacing:0; }

.histchips{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding-top:2px; }
.histchips .lab{ font-size:10.5px; color: var(--ink-4); letter-spacing:.06em; margin-right:2px; }
.hchip{
  font: inherit; font-size:11.5px; cursor:pointer; color: var(--ink-3);
  background: var(--glass-soft); border:1px solid var(--hair);
  padding: 3px 10px; border-radius:999px;
  transition: background .25s var(--ease), color .2s, transform .3s var(--spring);
}
.hchip:hover{ color: var(--ink-1); transform: translateY(-1px); }
.hchip.on{ background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 24%, transparent); }

/* ============ layer chain ============ */
.chain{ display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; }
.chain.n3{ grid-template-columns: repeat(3, 1fr); }
.chain.n5{ grid-template-columns: repeat(5, 1fr); }
.lay{
  position:relative; border:1px solid var(--hair); border-radius: var(--r-m);
  background: var(--glass-soft); padding: 11px 12px 12px;
  transition: transform .3s var(--spring), background .25s;
}
.lay:hover{ transform: translateY(-2px); background: var(--glass); }
.lay.top{ box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 42%, transparent); }
.lay .l1{ display:flex; align-items:center; gap:7px; }
.lay .ln{
  font-size:10px; font-weight:700; color:#fff; background: var(--ink-3);
  width:17px; height:17px; border-radius:6px; display:grid; place-items:center;
  font-variant-numeric: tabular-nums;
}
.lay.top .ln{ background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.lay .seg{ font-size:10px; color: var(--ink-4); letter-spacing:.06em; }
.lay .nm{ font-size:13px; font-weight:650; color: var(--ink-1); margin-top:3px; letter-spacing:.01em; }
.lay .note{ font-size:11.5px; color: var(--ink-3); line-height:1.5; margin-top:4px; min-height:2.9em; }
.lay .l3{ display:flex; align-items:center; gap:7px; margin-top:7px; }
.dots{ display:flex; gap:2.5px; }
.dots i{ width:4px; height:10px; border-radius:2px; background: color-mix(in srgb, var(--ink-1) 10%, transparent); }
.dots i.f{ background: linear-gradient(180deg, var(--accent-2), var(--accent)); }
.lay .sv{ font-size:10.5px; color: var(--ink-4); font-variant-numeric: tabular-nums; }
.lay .verdict{
  margin-left:auto; font-size:10.5px; padding:1px 7px; border-radius:999px;
  border:1px solid transparent; font-weight:600; letter-spacing:.02em; white-space:nowrap;
}
.v1{ color: var(--accent); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 22%, transparent) !important; }
.v2{ color: var(--a); background: rgba(47,127,240,.10); border-color: rgba(47,127,240,.22) !important; }
.v3{ color: var(--ink-4); background: var(--glass-soft); border-color: var(--hair) !important; }

/* ============ 财务口径 ============ */
.finwrap{ overflow-x:auto; margin: 0 -2px; padding: 0 2px 2px; }
.finwrap::-webkit-scrollbar{ height:0; }
.fintable{ width:100%; border-collapse:separate; border-spacing:0; font-size:12px; min-width: 900px; }
.fintable th{
  font-weight:600; font-size:10.5px; letter-spacing:.05em; color: var(--ink-4);
  text-align:right; padding: 0 11px 8px; white-space:nowrap;
  border-bottom:1px solid var(--hair);
}
.fintable th:first-child{ text-align:left; padding-left:2px; }
.fintable th:nth-child(2){ text-align:left; }
.fintable td{
  padding: 9px 11px; text-align:right; font-variant-numeric: tabular-nums;
  border-bottom:1px dashed var(--hair); color: var(--ink-2); white-space:nowrap;
}
.fintable td:first-child{ text-align:left; padding-left:2px; }
.fintable td:nth-child(2){ text-align:left; }
.fintable tr:last-child td{ border-bottom:0; }
.fintable tbody tr{ transition: background .2s var(--ease); }
.fintable tbody tr:hover td{ background: var(--glass-soft); }
.fintable .fn{ font-weight:650; color: var(--ink-1); font-size:12.5px; letter-spacing:.01em; }
.fintable .fc{ display:block; font-size:10px; color: var(--ink-4); font-weight:400; letter-spacing:.02em; margin-top:-1px; }
.fintable .fl{ font-size:10.5px; color: var(--ink-3); }
.fintable .score{ font-weight:700; }
.fintable .up{ color: var(--rise); }
.fintable .down{ color: var(--fall); }
.fintable .mut{ color: var(--ink-4); }
.fin-foot{ margin-top:11px; padding-top:9px; border-top:1px solid var(--hair);
  font-size:10.5px; color: var(--ink-4); line-height:1.65; letter-spacing:.02em; }
.fin-swipe{ display:none; margin-top:8px; font-size:10.5px; color: var(--ink-4);
  letter-spacing:.04em; text-align:center; }
@media (max-width: 1100px){
  .fin-swipe{ display:none; }
  .finwrap{ -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
  .finwrap::-webkit-scrollbar{ height:6px; }
  .finwrap::-webkit-scrollbar-thumb{ background: rgba(120,120,140,.34); border-radius:999px; }
  .finwrap::-webkit-scrollbar-track{ background: transparent; }
}
#finCard.can-scroll .fin-swipe{ display:block; }

/* ============ main two-col ============ */
.main{ display:grid; grid-template-columns: 350px minmax(0,1fr); gap:16px; align-items:start; }
.col-list{ position: sticky; top: 20px; }

.sc{
  flex:0 0 auto; font-size:11.5px; font-weight:700; font-variant-numeric: tabular-nums;
  padding: 2px 8px; border-radius:999px; letter-spacing:.02em;
}
.sc.S{ color:#fff; background: linear-gradient(135deg, var(--s), var(--accent-2)); }
.sc.A{ color:#fff; background: var(--a); }
.sc.B{ color:#fff; background: var(--b); }
.sc.C{ color:#fff; background: var(--c); }
.sc.NA{ color: var(--ink-3); background: var(--glass-soft); border:1px solid var(--hair); }

/* ============ rank list ============ */
.rows{ display:flex; flex-direction:column; gap:6px; }
.srow{
  position:relative; text-align:left; cursor:pointer; color:inherit; font: inherit;
  border:1px solid transparent; border-radius: var(--r-m);
  background: transparent; padding: 10px 11px;
  display:grid; grid-template-columns: 22px minmax(0,1fr) auto; gap: 2px 9px;
  align-items:center;
  transition: background .28s var(--ease), transform .32s var(--spring), box-shadow .28s var(--ease), border-color .28s;
}
.srow:hover{ background: var(--glass-soft); transform: translateX(2px); }
.srow.on{
  background: var(--glass-strong); border-color: var(--hair);
  box-shadow: var(--inner), var(--shadow-sm);
}
.srow.on::before{
  content:""; position:absolute; left:0; top:12px; bottom:12px; width:3px;
  border-radius:3px; background: linear-gradient(180deg, var(--accent), var(--accent-2));
}
.srow .rk{
  grid-row: 1 / span 2; align-self:start;
  font-size:11px; font-weight:700; color: var(--ink-4);
  font-variant-numeric: tabular-nums; padding-top:1px;
}
.srow .nm{ font-size:13.5px; font-weight:650; color: var(--ink-1); letter-spacing:.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.srow .cd{ font-size:10.5px; color: var(--ink-4); font-variant-numeric: tabular-nums; letter-spacing:.02em; margin-top:-1px; }
.srow .role{ grid-column: 2 / span 2; font-size:11.5px; color: var(--ink-3); line-height:1.45;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.srow .line{ grid-column: 2 / span 2; height:3px; border-radius:2px; margin-top:5px;
  background: color-mix(in srgb, var(--ink-1) 7%, transparent); overflow:hidden; }
.srow .line i{ display:block; height:100%; border-radius:2px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .6s var(--spring); }
.rows-foot{ margin-top:12px; padding-top:11px; border-top:1px solid var(--hair);
  font-size:11px; color: var(--ink-4); letter-spacing:.02em; line-height:1.6; }

/* ============ detail ============ */
#detail{ display:flex; flex-direction:column; gap:14px; }

.dhead{ display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap; }
.dhead .hl{ flex:1 1 320px; min-width:0; }
.dhead .h1{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.dhead h2{ margin:0; font-size:24px; font-weight:650; letter-spacing:-.025em; color: var(--ink-1); }
.dhead .code{ font-size:11.5px; color: var(--ink-4); font-variant-numeric: tabular-nums; letter-spacing:.03em; }
.dhead .role{ font-size:12.5px; color: var(--ink-3); margin-top:3px; }
.tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.tag{
  font-size:11px; padding:2px 9px; border-radius:999px;
  background: var(--glass-soft); border:1px solid var(--hair); color: var(--ink-2);
}
.tag.k{ background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 22%, transparent); }

.ring{ position:relative; flex:0 0 108px; width:108px; height:108px; }
.ring svg{ display:block; width:108px; height:108px; }
.rtrack{ fill:none; stroke: color-mix(in srgb, var(--ink-1) 8%, transparent); stroke-width:8; }
.rfill{
  fill:none; stroke: url(#rg); stroke-width:8; stroke-linecap:round;
  filter: drop-shadow(0 3px 10px color-mix(in srgb, var(--accent) 40%, transparent));
  transition: stroke-dashoffset .85s var(--spring);
}
.ring .num{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:26px; font-weight:700; letter-spacing:-.04em; line-height:1;
  font-variant-numeric: tabular-nums; color: var(--ink-1);
}
.ring .num small{ font-size:9.5px; font-weight:600; letter-spacing:.04em; color: var(--ink-4); margin-top:5px; }

.capwarn{
  font-size:11px; color:#b4632f; letter-spacing:.01em;
  background: rgba(224,118,79,.10); border-radius:8px; padding:5px 9px; margin-top:9px;
}
@media (prefers-color-scheme: dark){ .capwarn{ color:#f0a97f; background: rgba(224,118,79,.16); } }

.dims5{ display:grid; grid-template-columns: repeat(5, 1fr); gap:8px; margin-top:13px; }
.dim5{
  position:relative; cursor:pointer; text-align:left; font:inherit; color:inherit;
  background: var(--glass-soft); border:1px solid var(--hair); border-radius: var(--r-s);
  padding: 8px 20px 8px 10px;
  transition: background .25s var(--ease), box-shadow .28s var(--ease), transform .3s var(--spring);
}
.dim5:hover{ background: var(--glass); transform: translateY(-1px); }
.dim5::after{
  content:"›"; position:absolute; right:9px; top:6px; font-size:12px; line-height:1;
  color: var(--ink-4); transition: transform .32s var(--spring), color .2s;
}
.dim5.on{
  background: var(--glass);
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 48%, transparent), var(--shadow-sm);
}
.dim5.on::after{ transform: rotate(90deg); color: var(--accent); }
.dim5 .d1{ display:flex; align-items:baseline; justify-content:space-between; gap:4px; }
.dim5 .dn{ font-size:10.5px; color: var(--ink-3); letter-spacing:.02em; white-space:nowrap; }
.dim5 .dv{ font-size:12.5px; font-weight:700; font-variant-numeric: tabular-nums; color: var(--ink-1); letter-spacing:-.01em; }
.dim5 .dv small{ font-size:9.5px; font-weight:500; color: var(--ink-4); }
.dim5 .dt{ height:3px; border-radius:2px; margin-top:5px; background: color-mix(in srgb, var(--ink-1) 7%, transparent); overflow:hidden; }
.dim5 .df{ height:100%; border-radius:2px; background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width .8s var(--spring); }

.dimp-hint{ font-size:10.5px; color: var(--ink-4); letter-spacing:.03em; margin-top:9px; }
#dimp:not(:empty){ margin-top:9px; animation: pop .34s var(--spring) both; }
@keyframes pop{ from{ opacity:0; transform: translateY(-6px); } to{ opacity:1; transform:none; } }
.dimp{ border:1px solid var(--hair); border-radius: var(--r-m); background: var(--glass-soft); padding: 12px 14px; }
.dimp-hd{ display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; margin-bottom:9px; }
.dimp-hd h3{ margin:0; font-size:13px; font-weight:650; color: var(--ink-1); letter-spacing:.01em; }
.dimp-hd .band{
  font-size:10.5px; padding:1px 8px; border-radius:999px; letter-spacing:.02em;
  color: var(--accent); background: var(--accent-soft);
  border:1px solid color-mix(in srgb, var(--accent) 22%, transparent);
}
.dimp-hd .pts{ margin-left:auto; font-size:14px; font-weight:700; font-variant-numeric: tabular-nums; letter-spacing:-.02em; }
.dimp-hd .pts small{ font-size:10.5px; font-weight:500; color: var(--ink-4); }
.pm{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
.pm .col h4{ margin:0 0 5px; font-size:10px; letter-spacing:.07em; color: var(--ink-4); font-weight:600; }

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function rawTotal(st){
  return DIMS.reduce((a, k) => a + (Number(st.scores && st.scores[k]) || 0), 0);
}
function scoreInfo(st){
  const raw = rawTotal(st);
  const s = st.scores || {};
  const missing = DIMS.some((k) => !Number(s[k]));
  let cap = 100, reason = "";
  if ((s["卡脖子强度"] || 0) <= 10) { cap = Math.min(cap, 55); reason = "卡脖子强度 ≤10，总分封顶 55"; }
  if ((s["下游覆盖"] || 0) <= 8) { cap = Math.min(cap, 65); reason = "下游覆盖 ≤8，总分封顶 65"; }
  if ((s["预期差"] || 0) <= 5 && (s["竞争格局"] || 0) <= 10) { cap = Math.min(cap, 60); reason = "预期差与竞争格局双低，总分封顶 60"; }
  const final = Math.min(raw, cap);
  let tier, cat;
  if (final >= 80) { tier = "S"; cat = "核心研究"; }
  else if (final >= 65) { tier = "A"; cat = "重点跟踪"; }
  else if (final >= 50) { tier = "B"; cat = "观察名单"; }
  else { tier = "C"; cat = "暂缓"; }
  return { raw, final, capped: final < raw, reason, tier, cat, missing };
}

    "\n结论：" + t.verdict +
    "\n最大未解问题：" + ((best.gaps || [])[0] || "无") +
    "\n本报告仅供研究参考，不构成个人投资建议。";
  try { await navigator.clipboard.writeText(text); toast("结论已复制"); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("结论已复制"); }
    catch (e2) { toast("复制失败，请手动选择文本"); }
    document.body.removeChild(ta);
  }
}

/* ---------- boot ---------- */
function syncFinScroll(){
  const card = $("#finCard"), wrap = card && card.querySelector(".finwrap");
  if (!card || !wrap) return;
  card.classList.toggle("can-scroll", wrap.scrollWidth > wrap.clientWidth + 2);
}
function renderAll(){ renderHead(); renderLayers(); renderFin(); renderList(); renderDetail(); syncFinScroll(); }
function boot(){
  state.themeId = REPORT.themes[0].id;
  state.stockCode = ranked()[0].code;
  state.dim = null;
  if (REPORT.meta.demo) {
    $("#footNote").textContent = "示例数据结构 · 数值仅用于演示排版，非真实行情 ｜ 本报告仅供研究参考，不构成个人投资建议";
  }
  renderAll();
  let rz = null;
  window.addEventListener("resize", function () {
    clearTimeout(rz); rz = setTimeout(syncFinScroll, 120);
  });
}
boot();
</script>
